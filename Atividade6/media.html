<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Média do Aluno</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 8px 16px; }
        #resultado { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Média Aritmética</h1>

    <label>Nome do aluno:
        <input type="text" id="nome">
    </label>
    <label>Nota 1:
        <input type="number" id="nota1" step="0.1">
    </label>
    <label>Nota 2:
        <input type="number" id="nota2" step="0.1">
    </label>
    <label>Nota 3:
        <input type="number" id="nota3" step="0.1">
    </label>
    <label>Nota 4:
        <input type="number" id="nota4" step="0.1">
    </label>

    <button onclick="calcularMedia()">Calcular média</button>

    <p id="resultado"></p>

    <script src="media.js"></script>
</body>
</html>
